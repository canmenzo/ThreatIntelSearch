<!doctype html>
<!-- Shared file: identical copies live at the repo root (Firefox, MV2) and in chrome/ (Chrome, MV3). Edit both. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Threat Intel Search</title>
  <link rel="stylesheet" href="ui.css">
</head>
<body>
  <main class="panel" id="panel">
    <header class="bar">
      <span class="brand"><i data-icon="Search"></i>Threat Intel Search</span>
    </header>

    <section>
      <div class="ioc-row">
        <code id="ioc"></code>
        <button class="icon-btn" id="copy" title="Copy"><i data-icon="Document"></i></button>
      </div>
      <div class="raw" id="raw" hidden></div>
      <div class="types" id="types">
        <button data-type="ip">IP</button>
        <button data-type="domain">DOMAIN</button>
        <button data-type="hash">HASH</button>
        <span class="algo" id="algo"></span>
      </div>
      <div class="warn" id="warn" hidden><i data-icon="Danger"></i><span id="warn-text"></span></div>
    </section>

    <section class="score none" id="score">
      <div class="gauge">
        <svg viewBox="0 0 100 100"><circle class="track" cx="50" cy="50" r="42"/><circle class="arc" id="arc" cx="50" cy="50" r="42"/></svg>
        <span id="pct">—</span>
      </div>
      <div class="verdict">
        <div class="label" id="label">not enough data</div>
        <div class="breakdown" id="breakdown"></div>
      </div>
    </section>

    <section>
      <h2>Sources</h2>
      <div class="sources" id="sources"></div>
    </section>

    <section class="openall" id="openall">
      <button data-type="ip"><i data-icon="Send"></i>Open all · IP</button>
      <button data-type="domain"><i data-icon="Send"></i>Open all · Domain</button>
      <button data-type="hash"><i data-icon="Send"></i>Open all · Hash</button>
    </section>

    <footer class="foot"><i data-icon="InfoCircle"></i>not a verdict</footer>
  </main>
  <script src="common.js"></script>
  <script src="icons.js"></script>
  <script src="panel.js"></script>
</body>
</html>
