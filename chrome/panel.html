<!doctype html>
<!-- Shared file: identical copies live at the repo root (Firefox, MV2) and in chrome/ (Chrome, MV3). Edit both. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Threat Intel Search</title>
  <link rel="stylesheet" href="ui.css">
</head>
<body>
  <main class="panel" id="panel">
    <header class="bar">
      <span class="brand"><i data-icon="Search"></i>Threat Intel Search</span>
      <button class="icon-btn" id="settings" title="Settings and API keys"><i data-icon="Setting"></i></button>
    </header>

    <section class="ioc-card">
      <div class="ioc-row">
        <code id="ioc"></code>
        <button class="icon-btn" id="copy" title="Copy (C)"><i data-icon="Document"></i></button>
        <button class="icon-btn defang" id="defang" title="Copy defanged (D)">[.]</button>
      </div>
      <div class="raw" id="raw" hidden></div>
      <div class="types" id="types">
        <button data-type="ip">IP</button>
        <button data-type="domain">DOMAIN</button>
        <button data-type="hash">HASH</button>
        <span class="toast" id="toast"></span>
        <span class="algo" id="algo"></span>
      </div>
    </section>

    <div class="warn" id="warn" hidden><i data-icon="Danger"></i><span id="warn-text"></span></div>

    <section class="score none" id="score">
      <div class="score-head">
        <div class="gauge">
          <svg viewBox="0 0 100 100"><circle class="track" cx="50" cy="50" r="42"/><circle class="arc" id="arc" cx="50" cy="50" r="42"/></svg>
          <span id="pct">—</span>
        </div>
        <div class="verdict">
          <div class="label"><span id="verdict-icon"></span><span id="label">not enough data</span></div>
          <div class="confidence" id="confidence"></div>
        </div>
      </div>
      <div class="evidence" id="evidence"></div>
      <div class="score-foot" id="score-foot" hidden>
        <span id="cached"></span>
        <button class="link" id="refresh">refresh</button>
      </div>
    </section>

    <section>
      <h2>Sources</h2>
      <div class="sources" id="sources"></div>
    </section>

    <section class="openall" id="openall">
      <button data-type="ip"><i data-icon="Send"></i>Open all · IP</button>
      <button data-type="domain"><i data-icon="Send"></i>Open all · Domain</button>
      <button data-type="hash"><i data-icon="Send"></i>Open all · Hash</button>
    </section>

    <footer class="foot"><i data-icon="InfoCircle"></i>not a verdict · <button class="link" id="how">how scoring works</button></footer>
  </main>
  <script src="common.js"></script>
  <script src="icons.js"></script>
  <script src="panel.js"></script>
</body>
</html>
